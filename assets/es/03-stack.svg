<svg xmlns="http://www.w3.org/2000/svg" width="800" height="112" viewBox="0 0 800 112" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Stack Tecnológico</title>
<desc id="desc">Backend y Core: Java · C# (.NET) · Node.js | Frontend e Interfaz: TypeScript · React · Blazor · HTML/CSS | Bases de Datos: PostgreSQL · MySQL · Supabase | DevOps y QA: Git · GitHub · Docker</desc>
<defs>
  <linearGradient id="aw-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#15181D"/>
    <stop offset="55%" stop-color="#1C2028"/>
    <stop offset="100%" stop-color="#13161B"/>
  </linearGradient>
  <radialGradient id="aw-glow-left" cx="20%" cy="25%" r="55%">
    <stop offset="0%" stop-color="rgba(82, 96, 114, 0.28)"/>
    <stop offset="100%" stop-color="rgba(82, 96, 114, 0)"/>
  </radialGradient>
  <radialGradient id="aw-glow-amber" cx="82%" cy="72%" r="48%">
    <stop offset="0%" stop-color="rgba(180, 142, 54, 0.13)"/>
    <stop offset="100%" stop-color="rgba(180, 142, 54, 0)"/>
  </radialGradient>
  <linearGradient id="aw-active-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="rgba(245, 208, 66, 0.18)"/>
    <stop offset="100%" stop-color="rgba(46, 52, 60, 0.80)"/>
  </linearGradient>
  <linearGradient id="aw-banner-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="rgba(28, 32, 38, 0.92)"/>
    <stop offset="65%" stop-color="rgba(72, 85, 104, 0.34)"/>
    <stop offset="100%" stop-color="rgba(217, 119, 36, 0.28)"/>
  </linearGradient>
  <pattern id="aw-crosshairs" width="56" height="56" patternUnits="userSpaceOnUse">
    <path d="M28 24v8M24 28h8" stroke="rgba(255,255,255,0.13)" stroke-width="1"/>
  </pattern>
  <pattern id="coral-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="rgba(224, 90, 71, 0.18)"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#E05A47" stroke-width="2"/>
  </pattern>
  
</defs>
<style>
  text { font-family: 'Bahnschrift SemiCondensed', 'Segoe UI', 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; fill: #EEF1F5; }
  .sec-title { font-size: 13px; font-weight: 400; letter-spacing: 0.08em; fill: #FFFFFF; }
  .lbl { font-size: 10.5px; font-weight: 500; letter-spacing: 0.05em; }
  .val { font-size: 13px; font-weight: 600; letter-spacing: 0.03em; }
  .stat-num { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; fill: #FFFFFF; }
  .meta { font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; font-variant-numeric: tabular-nums; }
  .fade { animation: awFade 0.42s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: awGrow 0.75s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  @keyframes awFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes awGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  
</style>
<rect width="800" height="112" fill="url(#aw-bg-grad)"/>
<rect width="800" height="112" fill="url(#aw-glow-left)"/>
<rect width="800" height="112" fill="url(#aw-glow-amber)"/>
<rect width="800" height="112" fill="url(#aw-crosshairs)"/>
<rect x="0.5" y="0.5" width="799" height="111" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
<line x1="20" y1="16" x2="780" y2="16" stroke="rgba(255,255,255,0.52)" stroke-width="1"/><rect x="20" y="25" width="3.5" height="3.5" fill="#FFFFFF"/><text x="28" y="31" class="sec-title">STACK TECNOLÓGICO</text><text x="780" y="30" text-anchor="end" class="meta" fill="#9AA4B2">INGENIERÍA DEL SOFTWARE</text>
<g class="fade" style="animation-delay: 60ms">
      <rect x="20" y="38" width="184" height="58" fill="url(#aw-active-grad)" stroke="#F5D042" stroke-width="1.5"/>
      <text x="30" y="53" class="lbl" fill="#F5D042">BACKEND Y CORE</text>
      <text x="30" y="71" font-size="12" font-weight="600" fill="#FFFFFF">Java · C# (.NET) ·</text>
           <text x="30" y="86" font-size="12" font-weight="600" fill="#FFFFFF">Node.js</text>
    </g>
<g class="fade" style="animation-delay: 120ms">
      <rect x="212" y="38" width="184" height="58" fill="rgba(46, 52, 60, 0.76)" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"/>
      <text x="222" y="53" class="lbl" fill="#9AA4B2">FRONTEND E INTERFAZ</text>
      <text x="222" y="71" font-size="12" font-weight="600" fill="#FFFFFF">TypeScript · React ·</text>
           <text x="222" y="86" font-size="12" font-weight="600" fill="#FFFFFF">Blazor · HTML/CSS</text>
    </g>
<g class="fade" style="animation-delay: 180ms">
      <rect x="404" y="38" width="184" height="58" fill="rgba(46, 52, 60, 0.76)" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"/>
      <text x="414" y="53" class="lbl" fill="#9AA4B2">BASES DE DATOS</text>
      <text x="414" y="71" font-size="12" font-weight="600" fill="#FFFFFF">PostgreSQL · MySQL ·</text>
           <text x="414" y="86" font-size="12" font-weight="600" fill="#FFFFFF">Supabase</text>
    </g>
<g class="fade" style="animation-delay: 240ms">
      <rect x="596" y="38" width="184" height="58" fill="rgba(46, 52, 60, 0.76)" stroke="rgba(255, 255, 255, 0.20)" stroke-width="1"/>
      <text x="606" y="53" class="lbl" fill="#9AA4B2">DEVOPS Y QA</text>
      <text x="606" y="76" font-size="12.5" font-weight="600" fill="#FFFFFF">Git · GitHub · Docker</text>
    </g>
</svg>

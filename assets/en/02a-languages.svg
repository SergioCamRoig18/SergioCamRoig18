<rect width="400" height="210" fill="url(#aw-glow-amber)"/>
<rect width="400" height="210" fill="url(#aw-crosshairs)"/>
<rect x="0.5" y="0.5" width="399" height="209" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
<g fill="#EEF1F5">
